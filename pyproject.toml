[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scatac-calib"
version = "1.0.0"
description = "Calibration-aware evaluation for scATAC-seq sequence-to-accessibility models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Wheat scATAC Benchmark Team" },
]
keywords = ["scATAC-seq", "bioinformatics", "AUROC", "calibration", "benchmark"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
  "scikit-learn>=1.0",
]

[project.optional-dependencies]
h5ad = ["scanpy>=1.8"]
test = []

[project.scripts]
scatac-calib = "scatac_calib.__main__:main"

[tool.setuptools]
packages = ["scatac_calib"]
include-package-data = true

[tool.setuptools.package-data]
scatac_calib = ["py.typed"]
